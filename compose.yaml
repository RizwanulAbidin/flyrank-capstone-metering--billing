services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      # Inside the compose network the database host is `db`, not localhost.
      DATABASE_URL: postgres://postgres:dev@db:5432/metering
      PORT: 3000
      # Read from your .env; placeholders keep the stack bootable without Stripe.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
    depends_on:
      db:
        condition: service_healthy
    # Migrate, seed, then serve. Migrations are idempotent and the seed upserts,
    # so restarting the stack is safe and repeatable.
    command: sh -c "node src/db/migrate.js && node src/db/seed.js && node src/index.js"

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: metering
    ports: ["5432:5432"]
    # Postgres 18 stores data in a version-specific subdirectory and expects the
    # mount one level above it. The older /var/lib/postgresql/data path makes the
    # container refuse to start.
    volumes: [meteringdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The scheduled background job. Off by default so `docker compose up` stays
  # fast; start it with `docker compose --profile jobs up -d reconcile`.
  reconcile:
    build: .
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/metering
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      # How often to compare against Stripe. An hour in production; short here so
      # the behaviour is observable during a demo.
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-3600000}
      # Optional. If set, a run with failures POSTs its report here.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: node src/jobs/reconcile.js --loop

volumes:
  meteringdata:
